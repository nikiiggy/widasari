<title>Katalog Widasari Bakery – Gallery 2 Kolom</title>

<style>
:root {
  --primary: #8C1D24;
  --primary-dark: #6E1319;
  --cream: #FBF7F0;
  --cream-card: #FFFFFF;
  --cream-soft: #F5EBE1;
  --gold-accent: #D4A359;
  --ink: #2C221E;
  --muted: #7A6E67;
  --line: #EEDFD0;
  --wa: #25D366;
  --r: 16px;
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-tap-highlight-color:transparent}
body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;background:#1C1412;color:var(--ink);display:flex;justify-content:center}
a{text-decoration:none;color:inherit}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
:focus-visible{outline:2px solid var(--gold-accent);outline-offset:2px}

.app{width:100%;max-width:480px;min-height:100vh;background:var(--cream);display:flex;flex-direction:column;position:relative;box-shadow:0 0 40px rgba(0,0,0,0.5)}

/* HEADER KATALOG */
.header{
  background:linear-gradient(165deg, var(--primary) 0%, var(--primary-dark) 100%);
  color:var(--cream);
  padding:calc(20px + env(safe-area-inset-top,0px)) 20px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:30;
  box-shadow:0 4px 18px rgba(0,0,0,0.15);
}
.header-left{display:flex;align-items:center;gap:12px}
.btn-back{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.15);color:#fff;display:grid;place-items:center;transition:transform 0.15s}
.btn-back:active{transform:scale(0.92)}
.btn-back svg{width:20px;height:20px;stroke:currentColor}
.header-title h1{font-family:'Playfair Display',serif;font-size:1.25rem;font-weight:700;color:#FFF}
.header-title p{font-size:0.75rem;color:var(--gold-accent);font-weight:600;letter-spacing:1px;text-transform:uppercase}

.counter-badge{
  background:rgba(212,163,89,0.2);
  border:1px solid var(--gold-accent);
  color:var(--cream);
  font-size:0.75rem;
  font-weight:700;
  padding:4px 10px;
  border-radius:99px;
}

/* INTRO CONTENT */
.intro{padding:20px 20px 10px;text-align:center}
.intro h2{font-family:'Playfair Display',serif;font-size:1.35rem;color:var(--primary);margin-bottom:6px}
.intro p{font-size:0.82rem;color:var(--muted);line-height:1.5;max-width:38ch;margin:0 auto}

/* GALLERY 2 KOLOM */
.gallery-grid{
  display:grid;
  grid-template-columns:repeat(2, 1fr);
  gap:12px;
  padding:14px 16px 28px;
}

.gallery-item{
  background:var(--cream-card);
  border-radius:var(--r);
  overflow:hidden;
  border:1px solid var(--line);
  box-shadow:0 4px 14px rgba(140,29,36,0.06);
  aspect-ratio:1/1.414;
  position:relative;
  cursor:pointer;
  transition:transform 0.18s, box-shadow 0.18s;
}
.gallery-item:active{transform:scale(0.97)}
.gallery-item img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  transition:opacity 0.2s;
}
.gallery-item .overlay{
  position:absolute;
  inset:0;
  background:linear-gradient(to top, rgba(0,0,0,0.4) 0%, transparent 60%);
  opacity:0;
  transition:opacity 0.2s;
  display:flex;
  align-items:flex-end;
  justify-content:flex-end;
  padding:10px;
}
.gallery-item:hover .overlay{opacity:1}
.zoom-icon{
  width:30px;
  height:30px;
  border-radius:50%;
  background:rgba(255,255,255,0.85);
  color:var(--primary);
  display:grid;
  place-items:center;
  box-shadow:0 2px 8px rgba(0,0,0,0.2);
}
.zoom-icon svg{width:16px;height:16px;stroke:currentColor}

/* MODAL / LIGHTBOX FULLSCREEN WITH SWIPE & ZOOM */
.modal{
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(18,12,10,0.96);
  backdrop-filter:blur(10px);
  display:none;
  flex-direction:column;
  opacity:0;
  transition:opacity 0.25s ease;
  user-select:none;
  touch-action:none;
}
.modal.open{
  display:flex;
  opacity:1;
}

/* Modal Header Bar */
.modal-bar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:calc(16px + env(safe-area-inset-top,0px)) 20px 14px;
  color:#fff;
  z-index:110;
}
.modal-counter{font-size:0.88rem;font-weight:700;letter-spacing:1px;color:var(--gold-accent)}
.modal-actions{display:flex;align-items:center;gap:12px}
.modal-btn{
  width:38px;
  height:38px;
  border-radius:50%;
  background:rgba(255,255,255,0.15);
  color:#fff;
  display:grid;
  place-items:center;
  transition:background 0.15s, transform 0.15s;
}
.modal-btn:active{transform:scale(0.92);background:rgba(255,255,255,0.25)}
.modal-btn svg{width:20px;height:20px;stroke:currentColor}

/* Modal Stage & Viewport */
.modal-stage{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  overflow:hidden;
}

.modal-track{
  display:flex;
  width:100%;
  height:100%;
  transition:transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
}

.modal-slide{
  flex:0 0 100%;
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  padding:10px;
}

.modal-img-wrap{
  max-width:100%;
  max-height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:transform 0.1s ease-out;
  transform-origin:center center;
  cursor:grab;
}
.modal-img-wrap:active{cursor:grabbing}

.modal-slide img{
  max-width:100%;
  max-height:80vh;
  object-fit:contain;
  border-radius:12px;
  box-shadow:0 12px 40px rgba(0,0,0,0.6);
  pointer-events:none;
}

/* Navigasi Panah Modal */
.modal-arrow{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  width:44px;
  height:44px;
  border-radius:50%;
  background:rgba(255,255,255,0.18);
  backdrop-filter:blur(4px);
  color:#fff;
  display:grid;
  place-items:center;
  z-index:110;
  transition:background 0.15s, transform 0.15s;
  border:1px solid rgba(255,255,255,0.2);
}
.modal-arrow:active{transform:translateY(-50%) scale(0.92)}
.modal-arrow.prev{left:14px}
.modal-arrow.next{right:14px}
.modal-arrow svg{width:22px;height:22px;stroke:currentColor}

/* Footer Modal WA CTA */
.modal-foot{
  padding:16px 20px calc(20px + env(safe-area-inset-bottom,0px));
  display:flex;
  justify-content:center;
  z-index:110;
}
.btn-wa-modal{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  background:var(--wa);
  color:#FFF;
  font-weight:700;
  font-size:0.9rem;
  padding:12px 24px;
  border-radius:99px;
  box-shadow:0 6px 20px rgba(37,211,102,0.35);
  transition:transform 0.15s;
}
.btn-wa-modal:active{transform:scale(0.96)}
.btn-wa-modal svg{width:20px;height:20px;fill:currentColor}

/* Toast */
.toast{
  position:fixed;
  bottom:24px;
  left:50%;
  transform:translateX(-50%) translateY(100px);
  background:var(--primary-dark);
  color:var(--cream);
  padding:10px 20px;
  border-radius:99px;
  font-size:0.8rem;
  font-weight:600;
  border:1px solid var(--gold-accent);
  box-shadow:0 10px 25px rgba(0,0,0,0.3);
  transition:transform 0.3s cubic-bezier(0.175,0.885,0.32,1.275);
  z-index:150;
  pointer-events:none;
  opacity:0;
}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

function renderGallery() {
  photoCountBadge.textContent = photoList.length + ' Foto';
  galleryGrid.innerHTML = photoList.map((item, idx) => `

// Modal Control
function openModal(index) {
  currentIndex = index;
  modal.classList.add('open');
  document.body.style.overflow = 'hidden';
  resetZoom();
  updateModalPosition();
}

function closeModal() {
  modal.classList.remove('open');
  document.body.style.overflow = '';
  resetZoom();
}

function updateModalPosition() {
  modalTrack.style.transform = `translateX(-${currentIndex * 100}%)`;
  modalCounter.textContent = `${currentIndex + 1} / ${photoList.length}`;
  resetZoom();
}

function prevSlide() {
  if (currentIndex > 0) {
    currentIndex--;
    updateModalPosition();
  } else {
    currentIndex = photoList.length - 1;
    updateModalPosition();
  }
}

function nextSlide() {
  if (currentIndex < photoList.length - 1) {
    currentIndex++;
    updateModalPosition();
  } else {
    currentIndex = 0;
    updateModalPosition();
  }
}

// Zoom & Pan Logic
function resetZoom() {
  scale = 1;
  translateX = 0;
  translateY = 0;
  isZoomed = false;
  applyTransform();
}

function toggleZoom() {
  if (isZoomed) {
    resetZoom();
  } else {
    scale = 2.2;
    isZoomed = true;
    applyTransform();
  }
}

function applyTransform() {
  const currentWrap = document.getElementById(`wrap-${currentIndex}`);
  if (currentWrap) {
    currentWrap.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
  }
}

// Event Listeners Navigasi
btnPrev.addEventListener('click', prevSlide);
btnNext.addEventListener('click', nextSlide);
btnClose.addEventListener('click', closeModal);
btnZoomToggle.addEventListener('click', toggleZoom);

// Touch / Swipe Navigation & Pinch Zoom
const modalStage = document.getElementById('modalStage');

modalStage.addEventListener('touchstart', (e) => {
  if (e.touches.length === 1) {
    isDragging = true;
    startX = e.touches[0].clientX - translateX;
    startY = e.touches[0].clientY - translateY;
    touchStartX = e.touches[0].clientX;
  }
}, { passive: true });

modalStage.addEventListener('touchmove', (e) => {
  if (!isDragging) return;
  if (e.touches.length === 1) {
    if (scale > 1) {
      // Pan saat zoom in
      translateX = e.touches[0].clientX - startX;
      translateY = e.touches[0].clientY - startY;
      applyTransform();
    } else {
      // Swipe horizontal antar foto
      touchEndX = e.touches[0].clientX;
    }
  }
}, { passive: true });

modalStage.addEventListener('touchend', () => {
  if (!isDragging) return;
  isDragging = false;
  if (scale === 1) {
    const diffX = touchStartX - touchEndX;
    if (Math.abs(diffX) > 40 && touchEndX !== 0) {
      if (diffX > 0) nextSlide();
      else prevSlide();
    }
  }
  touchStartX = 0;
  touchEndX = 0;
});

// Mouse Drag & Zoom untuk Desktop/Tablet
modalStage.addEventListener('mousedown', (e) => {
  if (scale > 1) {
    isDragging = true;
    startX = e.clientX - translateX;
    startY = e.clientY - translateY;
  }
});

window.addEventListener('mousemove', (e) => {
  if (isDragging && scale > 1) {
    translateX = e.clientX - startX;
    translateY = e.clientY - startY;
    applyTransform();
  }
});

window.addEventListener('mouseup', () => { isDragging = false; });

// Double Click / Double Tap to Zoom
modalStage.addEventListener('dblclick', toggleZoom);

// Keyboard Shortcuts
window.addEventListener('keydown', (e) => {
  if (!modal.classList.contains('open')) return;
  if (e.key === 'Escape') closeModal();
  if (e.key === 'ArrowLeft') prevSlide();
  if (e.key === 'ArrowRight') nextSlide();
});

// Inisialisasi
renderGallery();
</script>
</body>
</html>
